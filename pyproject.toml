[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlcd-fedlora"
version = "0.1.0"
description = "Core implementation of RLCD-FedLoRA"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "torch>=1.13",
]

[tool.setuptools.packages.find]
include = ["rlcd_fedlora*"]
