name: Tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q
      - name: RoBERTa protocol and baseline tests
        working-directory: experiments/roberta
        run: python -m pytest -q jl_test_protocol.py jl_test_rank.py jl_test_controller_study.py jl_test_bounds.py jl_test_component_ablation.py
      - name: OPT model and preprocessing tests
        working-directory: experiments/opt
        run: python -m pytest -q jl_test_opt_actions.py jl_test_opt_model.py jl_test_opt_data.py jl_test_opt_preflight.py
      - name: Synthetic end-to-end experiments
        run: python smoke_test.py --output-root /tmp/rlcd-smoke
